<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f1f1a">
    <meta name="description" content="Minesweeper — the classic mine-hunting puzzle. Installable PWA, works offline.">
    <title>Minesweeper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f1f1a;
            --panel: #16291f;
            --cell: #1f3629;
            --cell-open: #14231b;
            --ink: #f2fbf5;
            --muted: #8fae9b;
            --accent: #10b981;
            --accent-deep: #059669;
            --danger: #ef4444;
            --radius: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 14px calc(26px + env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .wrap { width: 100%; max-width: 440px; }

        .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .top img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 4px 14px rgba(16,185,129,.4); }
        .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }

        .diffs { display: flex; gap: 8px; margin-bottom: 12px; }
        .diff {
            flex: 1; border: 1px solid rgba(255,255,255,.12); background: var(--panel);
            color: var(--muted); border-radius: 10px; padding: 10px 4px;
            font-size: 13px; font-weight: 700; cursor: pointer; min-height: 44px;
        }
        .diff small { display: block; font-weight: 600; font-size: 11px; opacity: .75; margin-top: 1px; }
        .diff.active { background: var(--accent); border-color: var(--accent); color: #06281c; }
        .diff.active small { opacity: .8; }

        .hud { display: flex; gap: 8px; margin-bottom: 12px; }
        .stat {
            flex: 1; background: var(--panel); border-radius: 10px; padding: 8px 6px;
            text-align: center; font-size: 17px; font-weight: 800;
        }
        .stat .lbl { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 2px; }

        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        .seg { flex: 1; display: flex; background: var(--panel); border-radius: 12px; padding: 4px; gap: 4px; }
        .seg button {
            flex: 1; border: none; background: transparent; color: var(--muted);
            border-radius: 9px; font-size: 15px; font-weight: 800; padding: 11px 0; cursor: pointer;
            min-height: 46px;
        }
        .seg button.active { background: var(--accent); color: #06281c; }
        .new-btn {
            border: none; border-radius: 12px; cursor: pointer; padding: 0 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #06281c; font-size: 15px; font-weight: 800; min-height: 54px;
            box-shadow: 0 6px 18px rgba(16,185,129,.35);
        }
        .new-btn:active { transform: scale(.96); }

        .board-wrap { position: relative; }
        .board {
            display: grid; gap: 3px; background: var(--panel);
            padding: 8px; border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0,0,0,.4);
            touch-action: none;
        }
        .cell {
            aspect-ratio: 1 / 1; border: none; border-radius: 6px;
            background: var(--cell); color: var(--ink);
            font-size: 15px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1;
        }
        .cell:active { filter: brightness(1.25); }
        .cell.open { background: var(--cell-open); cursor: default; }
        .cell.open:active { filter: none; }
        .cell.boom { background: var(--danger); }
        .cell .n1 { color: #60a5fa; } .cell .n2 { color: #4ade80; }
        .cell .n3 { color: #f87171; } .cell .n4 { color: #c084fc; }
        .cell .n5 { color: #fb923c; } .cell .n6 { color: #2dd4bf; }
        .cell .n7 { color: #f472b6; } .cell .n8 { color: #9ca3af; }
        .cell.wrong { background: rgba(239,68,68,.35); }

        .overlay {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(15,31,26,.85); backdrop-filter: blur(3px);
            border-radius: var(--radius);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            opacity: 0; pointer-events: none; transition: opacity .25s ease;
            padding: 24px; text-align: center;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .overlay .big { font-size: 52px; }
        .overlay h2 { font-size: 30px; font-weight: 800; }
        .overlay p { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
        .overlay p b { color: var(--ink); }
        .overlay button {
            border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #06281c; font-size: 16px; font-weight: 800; padding: 15px 30px; min-height: 54px;
            box-shadow: 0 6px 18px rgba(16,185,129,.4);
        }
        .overlay button:active { transform: scale(.96); }

        .tip { text-align: center; margin-top: 12px; font-size: 12px; color: var(--muted); opacity: .8; line-height: 1.6; }
        footer { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <img src="icon-192.png" alt="Minesweeper icon">
            <h1>Minesweeper</h1>
        </div>

        <div class="diffs" id="diffs">
            <button class="diff active" data-d="easy">Easy<small>9×9 · 10 💣</small></button>
            <button class="diff" data-d="medium">Medium<small>12×12 · 25 💣</small></button>
            <button class="diff" data-d="hard">Hard<small>16×16 · 50 💣</small></button>
        </div>

        <div class="hud">
            <div class="stat"><span class="lbl">Mines</span><span id="mineCount">10</span></div>
            <div class="stat"><span class="lbl">Time</span><span id="timer">0</span></div>
            <div class="stat"><span class="lbl">Best</span><span id="best">–</span></div>
        </div>

        <div class="controls">
            <div class="seg">
                <button id="digBtn" class="active">⛏️ Dig</button>
                <button id="flagBtn">🚩 Flag</button>
            </div>
            <button class="new-btn" id="newBtn">New</button>
        </div>

        <div class="board-wrap">
            <div class="board" id="board"></div>
            <div class="overlay" id="overlay">
                <div class="big" id="ovEmoji">💥</div>
                <h2 id="ovTitle">Boom!</h2>
                <p id="ovSub"></p>
                <button id="ovBtn">Try again</button>
            </div>
        </div>

        <div class="tip">Tap a number with all its mines flagged to clear around it.<br>Long-press a cell to flag it quickly.</div>
        <footer>Made with ❤️ by Sauravhhh</footer>
    </div>

    <script src="game-logic.js"></script>
    <script>
        (function () {
            'use strict';
            var MS = window.Minesweeper;
            var DIFFS = {
                easy:   { rows: 9,  cols: 9,  mines: 10 },
                medium: { rows: 12, cols: 12, mines: 25 },
                hard:   { rows: 16, cols: 16, mines: 50 }
            };

            var board = document.getElementById('board');
            var mineCountEl = document.getElementById('mineCount');
            var timerEl = document.getElementById('timer');
            var bestEl = document.getElementById('best');
            var overlay = document.getElementById('overlay');
            var ovEmoji = document.getElementById('ovEmoji');
            var ovTitle = document.getElementById('ovTitle');
            var ovSub = document.getElementById('ovSub');
            var digBtn = document.getElementById('digBtn');
            var flagBtn = document.getElementById('flagBtn');

            var diffKey = 'easy';
            var state = null;
            var mode = 'dig';
            var cellEls = [];
            var timerId = null;
            var seconds = 0;
            var bests = {};
            try { bests = JSON.parse(localStorage.getItem('minesweeper_best') || '{}'); } catch (e) { bests = {}; }

            function bestFor() { return bests[diffKey] || null; }
            function renderBest() {
                var b = bestFor();
                bestEl.textContent = b === null ? '–' : b + 's';
            }

            function startTimer() {
                stopTimer();
                seconds = 0;
                timerEl.textContent = '0';
                timerId = setInterval(function () {
                    seconds++;
                    timerEl.textContent = seconds > 999 ? '999+' : seconds;
                }, 1000);
            }
            function stopTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
            }

            function newGame() {
                var d = DIFFS[diffKey];
                state = MS.createBoard(d.rows, d.cols, d.mines);
                stopTimer();
                seconds = 0;
                timerEl.textContent = '0';
                mineCountEl.textContent = d.mines;
                overlay.classList.remove('show');
                renderBest();
                buildBoard();
            }

            function buildBoard() {
                board.innerHTML = '';
                board.style.gridTemplateColumns = 'repeat(' + state.cols + ', 1fr)';
                cellEls = [];
                var baseSize = state.cols >= 16 ? 15 : state.cols >= 12 ? 17 : 20;
                for (var r = 0; r < state.rows; r++) {
                    cellEls.push([]);
                    for (var c = 0; c < state.cols; c++) {
                        (function (rr, cc) {
                            var b = document.createElement('button');
                            b.className = 'cell';
                            b.style.fontSize = baseSize + 'px';
                            b.setAttribute('aria-label', 'cell ' + rr + ',' + cc);
                            b.addEventListener('click', function () { onTap(rr, cc); });
                            b.addEventListener('contextmenu', function (e) {
                                e.preventDefault();
                                doFlag(rr, cc);
                            });
                            // Long-press to flag
                            var lpTimer = null;
                            b.addEventListener('touchstart', function () {
                                lpTimer = setTimeout(function () {
                                    suppressNextClick = true;
                                    doFlag(rr, cc);
                                }, 450);
                            }, { passive: true });
                            b.addEventListener('touchend', function () { clearTimeout(lpTimer); }, { passive: true });
                            b.addEventListener('touchmove', function () { clearTimeout(lpTimer); }, { passive: true });
                            board.appendChild(b);
                            cellEls[rr].push(b);
                        })(r, c);
                    }
                }
                // suppress the synthetic click that follows a long-press flag
                board.addEventListener('click', function (e) {
                    if (suppressNextClick) { e.stopPropagation(); e.preventDefault(); suppressNextClick = false; }
                }, true);
            }
            var suppressNextClick = false;

            function paintCell(r, c) {
                var cell = state.grid[r][c];
                var el = cellEls[r][c];
                el.className = 'cell';
                el.innerHTML = '';
                if (cell.revealed) {
                    el.classList.add('open');
                    if (cell.mine) {
                        el.textContent = '💣';
                    } else if (cell.count > 0) {
                        var s = document.createElement('span');
                        s.className = 'n' + cell.count;
                        s.textContent = cell.count;
                        el.appendChild(s);
                    }
                } else if (cell.flagged) {
                    el.textContent = '🚩';
                }
            }

            function updateMineCount() {
                mineCountEl.textContent = state.mineCount - state.flaggedCount;
            }

            function ensureTimer() {
                if (state.status === 'playing' && !timerId) startTimer();
            }

            function onTap(r, c) {
                if (suppressNextClick) { suppressNextClick = false; return; }
                if (state.status === 'won' || state.status === 'lost') return;
                var cell = state.grid[r][c];
                if (cell.revealed) {
                    var res = MS.chord(state, r, c);
                    afterReveal(res, false);
                    return;
                }
                if (mode === 'flag') { doFlag(r, c); return; }
                var res2 = MS.reveal(state, r, c);
                ensureTimer();
                afterReveal(res2, true);
            }

            function doFlag(r, c) {
                if (state.status === 'won' || state.status === 'lost') return;
                if (state.grid[r][c].revealed) return;
                MS.toggleFlag(state, r, c);
                paintCell(r, c);
                updateMineCount();
                if (navigator.vibrate) { try { navigator.vibrate(5); } catch (e) {} }
            }

            function afterReveal(res, animateBoom) {
                res.revealed.forEach(function (xy) { paintCell(xy[0], xy[1]); });
                if (res.exploded) {
                    stopTimer();
                    var boomEl = null;
                    res.revealed.forEach(function (xy) {
                        var el = cellEls[xy[0]][xy[1]];
                        el.classList.add('boom');
                        el.textContent = '💥';
                        boomEl = el;
                    });
                    // Reveal all mines, mark wrong flags
                    setTimeout(function () {
                        for (var r = 0; r < state.rows; r++)
                            for (var c = 0; c < state.cols; c++) {
                                var cell = state.grid[r][c];
                                var el = cellEls[r][c];
                                if (cell.mine && !cell.revealed && !cell.flagged) {
                                    el.classList.add('open');
                                    el.textContent = '💣';
                                } else if (!cell.mine && cell.flagged) {
                                    el.classList.add('wrong');
                                    el.textContent = '❌';
                                }
                            }
                        showEnd(false);
                    }, 600);
                    if (navigator.vibrate) { try { navigator.vibrate([60, 40, 60]); } catch (e) {} }
                } else if (res.won || state.status === 'won') {
                    stopTimer();
                    // Flag all remaining mines for a satisfying finish
                    for (var r2 = 0; r2 < state.rows; r2++)
                        for (var c2 = 0; c2 < state.cols; c2++) {
                            var cl = state.grid[r2][c2];
                            if (cl.mine && !cl.flagged) { cl.flagged = true; state.flaggedCount++; paintCell(r2, c2); }
                        }
                    updateMineCount();
                    setTimeout(function () { showEnd(true); }, 400);
                }
            }

            function showEnd(won) {
                if (won) {
                    var prev = bestFor();
                    var isBest = prev === null || seconds < prev;
                    if (isBest) {
                        bests[diffKey] = seconds;
                        try { localStorage.setItem('minesweeper_best', JSON.stringify(bests)); } catch (e) {}
                        renderBest();
                    }
                    ovEmoji.textContent = '🏆';
                    ovTitle.textContent = 'You Win!';
                    ovSub.innerHTML = 'Cleared in <b>' + seconds + 's</b>' + (isBest ? ' — new best!' : '');
                } else {
                    ovEmoji.textContent = '💥';
                    ovTitle.textContent = 'Boom!';
                    ovSub.innerHTML = 'You hit a mine after <b>' + seconds + 's</b>.';
                }
                overlay.classList.add('show');
            }

            document.getElementById('newBtn').addEventListener('click', newGame);
            document.getElementById('ovBtn').addEventListener('click', newGame);
            document.getElementById('diffs').addEventListener('click', function (e) {
                var b = e.target.closest('.diff');
                if (!b) return;
                document.querySelectorAll('.diff').forEach(function (d) { d.classList.remove('active'); });
                b.classList.add('active');
                diffKey = b.getAttribute('data-d');
                newGame();
            });
            digBtn.addEventListener('click', function () {
                mode = 'dig';
                digBtn.classList.add('active');
                flagBtn.classList.remove('active');
            });
            flagBtn.addEventListener('click', function () {
                mode = 'flag';
                flagBtn.classList.add('active');
                digBtn.classList.remove('active');
            });

            newGame();

            // PWA service worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function (err) {
                        console.warn('SW registration failed:', err);
                    });
                });
            }
        })();
    </script>
</body>
</html>
